<!DOCTYPE html>
<html>
<head>
    <title>Student Names</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: darkblue;
        }
        table {
            border-collapse: collapse;
            width: 60%;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th {
            background-color: lightgray;
        }
        td {
            padding: 8px;
            text-align: center;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 5px;
            width: 200px;
        }
        button {
            padding: 6px 12px;
            background-color: darkblue;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: navy;
        }
    </style>
</head>
<body>
    <h1>List of Students</h1>

    <!-- Student Table -->
    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Akhilesh</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Priya</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Rahul</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Neha</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Arjun</td>
        </tr>
    </table>

    <!-- Form to Add Student -->
    <form>
        <label for="studentName">Enter New Student Name:</label>
        <input type="text" id="studentName" name="studentName" placeholder="Type name here">
        <button type="submit">Add Student</button>
    </form>
</body>
</html>
